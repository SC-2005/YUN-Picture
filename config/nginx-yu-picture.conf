# ⚠️ 仅作备份：生产环境的前端站点已交给宝塔「网站 → 123.207.58.189」管理，
# vhost 由宝塔生成在 /www/server/panel/vhost/nginx/123.207.58.189.conf，
# 反向代理在面板「站点设置 → 反向代理 → api」。不要再把这个文件放进宝塔的 vhost 目录，
# 否则会和宝塔生成的 server 抢同一个域名。
server {
    listen 80;
    server_name 123.207.58.189;

    root /www/wwwroot/yu-picture;
    index index.html;

    access_log /www/wwwlogs/yu-picture.log;
    error_log  /www/wwwlogs/yu-picture.error.log;

    client_max_body_size 20m;

    # 前端 history 路由，刷新子页面回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 协同编辑 WebSocket（必须放在 /api/ 前面，nginx 按最长前缀匹配，实际顺序不影响）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端接口，context-path 本身就是 /api，原样转发
    location /api/ {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
